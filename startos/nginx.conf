user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

# The Chama UI proxies /bridge/ to its native wallet bridge on loopback.
# /await-invoice is a long poll held open
# until the payer actually pays, so a read timeout there is a clock on the human,
# not on the bridge: at nginx's default it hung up during an ordinary
# scan-the-QR pause and answered with its own 504 HTML, which the client read as
# a rejected payment. The bridge stays reachable for a full invoice lifetime.
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  map $sent_http_content_type $cache_control {
    default "public, max-age=3600";
    "text/html" "no-cache";
  }

  # StartOS sets X-Forwarded-Proto on its TLS leg and strips any a client sends.
  map $http_x_forwarded_proto $chama_scheme {
    default http;
    https https;
  }

  # The bridge answers only the page's own origin, whichever address it was loaded from.
  map "$http_origin $chama_scheme://$http_host" $chama_foreign_origin {
    "~^ " 0;
    "~*^(\S+) \1$" 0;
    default 1;
  }

  map $http_sec_fetch_site $chama_foreign_site {
    "" 0;
    same-origin 0;
    default 1;
  }

  server {
    listen 8080;
    location /bridge/ {
      if ($chama_foreign_origin) { return 403; }
      if ($chama_foreign_site) { return 403; }
      proxy_pass http://127.0.0.1:8787/;
      include /etc/nginx/chama-bridge-auth.conf;
      proxy_connect_timeout 10s;
      proxy_send_timeout 3600s;
      proxy_read_timeout 3600s;
    }
    location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; add_header Cache-Control $cache_control always; }
  }
}
